# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
# GitHub Actions CI/CD Pipeline
#
# Automated Container Failure Detection, Self-Recovery and Notification
# DevOps Mini Project
#
# PIPELINE STAGES:
#   Job 1 — test:
#     1. Checkout code
#     2. Set up Python 3.11
#     3. Install dependencies
#     4. Run pytest with coverage (enforces 80% minimum)
#     5. Integration smoke test (starts live gunicorn, hits /health via curl)
#     6. Upload coverage report artifact
#
#   Job 2 — build-and-push (only runs if Job 1 passes):
#     1. Checkout code
#     2. Set up Docker Buildx
#     3. Log in to Docker Hub
#     4. Extract image metadata (tags + labels)
#     5. Build and push image to Docker Hub (:latest + :sha-<commit>)
#
# REQUIRED GITHUB SECRETS:
#   DOCKERHUB_USERNAME  – Your Docker Hub username
#   DOCKERHUB_TOKEN     – Docker Hub access token (NOT your password)
#                         Create at: https://hub.docker.com/settings/security
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ───────────────────────────────────────────
  # JOB 1: Test + Integration Smoke Test
  # ───────────────────────────────────────────
  test:
    name: Run Tests & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # ── Unit tests with enforced coverage threshold ──────────────────────────
      - name: Run pytest with coverage (min 80%)
        run: |
          pytest tests/ -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── Integration smoke test — starts the real app and hits /health ────────
      # This proves the app actually runs as a server, not just passes unit tests.
      - name: Start Flask app (gunicorn) for integration test
        run: |
          cd app
          gunicorn --workers=1 --bind=0.0.0.0:5000 app:app &
          echo $! > /tmp/gunicorn.pid
          sleep 6
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Integration smoke test — verify live /health endpoint
        run: |
          echo "Testing root endpoint..."
          curl -f http://localhost:5000/ || (echo "❌ Root endpoint failed" && exit 1)

          echo "Testing /health endpoint..."
          RESPONSE=$(curl -sf http://localhost:5000/health)
          echo "Response: $RESPONSE"

          echo "$RESPONSE" | python -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data.get('status') == 'HEALTHY', f'Expected HEALTHY, got: {data}'
          assert 'uptime_seconds' in data, 'Missing uptime_seconds field'
          print('✅ Smoke test passed: /health returns HEALTHY with uptime_seconds')
          "

          echo "Testing /metrics endpoint (Prometheus format)..."
          curl -f http://localhost:5000/metrics | grep -q "flask_health_status" \
            || (echo "❌ /metrics missing flask_health_status" && exit 1)
          echo "✅ /metrics endpoint returning Prometheus data"

          kill $(cat /tmp/gunicorn.pid) 2>/dev/null || true

      # ── Upload coverage artifact ─────────────────────────────────────────────
      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # ───────────────────────────────────────────
  # JOB 2: Build and Push Docker Image
  # (only runs after tests pass)
  # ───────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test          # Only runs if the test job passes

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm image pushed to Docker Hub
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:latest"
          echo "SHA tag: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:sha-${{ github.sha }}"
