# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
# GitHub Actions CI/CD Pipeline
#
# Automated Container Failure Detection, Self-Recovery and Notification
# DevOps Mini Project
#
# PIPELINE STAGES:
#   1. Checkout code
#   2. Set up Python
#   3. Install dependencies
#   4. Run automated tests (pytest)
#   5. Build Docker image
#   6. Push Docker image to Docker Hub
#
# REQUIRED GITHUB SECRETS:
#   DOCKERHUB_USERNAME  – Your Docker Hub username
#   DOCKERHUB_TOKEN     – Docker Hub access token (NOT your password)
#                         Create at: https://hub.docker.com/settings/security
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ───────────────────────────────────────────
  # JOB 1: Test
  # ───────────────────────────────────────────
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest with coverage report
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # ───────────────────────────────────────────
  # JOB 2: Build and Push Docker Image
  # ───────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test          # Only runs if the test job passes

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was pushed
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:latest"
          echo "SHA tag: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:sha-${{ github.sha }}"
